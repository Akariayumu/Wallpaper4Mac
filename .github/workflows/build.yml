name: Build macOS Binary

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      
      - name: Build CLI
        run: |
          unset GOTOOLCHAIN
          CGO_ENABLED=1 go build -o wallpaper-cli -v .
      
      - name: Build GUI
        run: |
          unset GOTOOLCHAIN
          swiftc -o wallpaper-gui gui.swift -framework SwiftUI -framework AppKit
      
      - name: Create App Bundle
        run: |
          mkdir -p Wallpaper4Mac.app/Contents/MacOS
          cp wallpaper-cli Wallpaper4Mac.app/Contents/MacOS/
          cp wallpaper-gui Wallpaper4Mac.app/Contents/MacOS/
          cat > Wallpaper4Mac.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>wallpaper-gui</string>
              <key>CFBundleIdentifier</key>
              <string>com.wallpaper4mac.app</string>
              <key>CFBundleName</key>
              <string>Wallpaper4Mac</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF
      
      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Wallpaper4Mac
          path: Wallpaper4Mac.app
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: wallpaper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
